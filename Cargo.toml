[workspace]
members = [
  "fil_actors_shared",
  "fil_actors_test_utils",
  "actors/account",
  "actors/init",
  "actors/cron",
  "actors/paych",
  "actors/system",
  "actors/multisig",
  "actors/market",
  "actors/power",
  "actors/reward",
  "actors/verifreg",
  "actors/miner",
  "actors/datacap",
  "actors/eam",
  "actors/evm",
  "actors/ethaccount",
]
resolver = "3"

[workspace.package]
version = "27.2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChainSafe/fil-actor-states"
authors = [
  "ChainSafe Systems <info@chainsafe.io>",
  "Protocol Labs",
  "Filecoin Core Devs",
]
edition = "2024"
keywords = ["filecoin", "web3", "wasm"]

[workspace.metadata.cargo-shear]
# Referenced only from `num_derive` and `fvm_ipld_encoding` derive macro expansions.
ignored = ["num-traits", "serde"]

[workspace.dependencies]
anyhow = "1"
bitflags = "2"
cid = { version = "0.11", default-features = false, features = ["std"] }
fil_actor_evm_state = { version = "27.2.0", path = "./actors/evm" }
fil_actor_verifreg_state = { version = "27.2.0", path = "./actors/verifreg" }
fil_actors_shared = { version = "27.2.0", path = "./fil_actors_shared" }
frc42_dispatch = "11"
frc46_token = "15"
fvm_ipld_amt = "0.7"
fvm_ipld_bitfield = "0.7"
fvm_ipld_blockstore = "0.3"
fvm_ipld_encoding = "0.5"
fvm_ipld_hamt = "0.10"
fvm_shared = { version = "~2", default-features = false }
fvm_shared3 = { package = "fvm_shared", version = "~3", default-features = false }
fvm_shared4 = { package = "fvm_shared", version = "~4", default-features = false }
hex = "0.4"
hex-literal = "1"
indexmap = { version = "2", features = ["serde"] }
integer-encoding = { version = "4", default-features = false }
ipld-core = { version = "0.4", features = ["serde"] }
itertools = "0.15"
lazy_static = "1"
log = "0.4"
multihash-codetable = { version = "0.2", features = ["sha2"] }
num = "0.4"
num-bigint = { version = "0.4", features = ["serde"] }
num-derive = "0.5"
num-traits = "0.2"
parking_lot = "0.13"
pastey = "0.2"
pretty_assertions = "1"
quickcheck = "1"
quickcheck_macros = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
thiserror = "2"
uint = { version = "0.10", default-features = false }
unsigned-varint = "0.8"

fil_actors_test_utils = { path = "./fil_actors_test_utils" }
